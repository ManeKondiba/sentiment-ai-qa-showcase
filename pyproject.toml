[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-ai-qa-showcase"
version = "0.1.0"
description = "Showcase framework for sentiment classifier testing and evaluation"
requires-python = ">=3.10"
dependencies = [
    "deepeval>=4.0.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "deepeval>=4.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
